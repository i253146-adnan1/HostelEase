{% extends 'base.html' %}

{% block title %}Access Denied — HostelEase{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm border-0 text-center">
            <div class="card-body p-4 p-md-5">
                <div class="text-danger mb-3">
                    <i class="bi bi-shield-exclamation" style="font-size:3rem;"></i>
                </div>
                <h1 class="h4 fw-bold mb-2">Access Denied (403)</h1>
                <p class="text-muted mb-4">{{ message|default:"You do not have permission to access this page." }}</p>
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:dashboard' %}" class="btn btn-primary px-4">Return to Dashboard</a>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary px-4">Sign In</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
