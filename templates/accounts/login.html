{% extends 'base.html' %}

{% block title %}Sign In — HostelEase{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="he-brand-icon mb-3" style="width:48px;height:48px;font-size:1.35rem;">
                        <i class="bi bi-building-check"></i>
                    </span>
                    <h2 class="h4 fw-bold mb-1">Sign In to HostelEase</h2>
                    <p class="text-muted small mb-0">Enter your warden or student credentials</p>
                </div>
                <form method="post" action="{% url 'accounts:login' %}">
                    {% csrf_token %}
                    {% if request.GET.next %}
                        <input type="hidden" name="next" value="{{ request.GET.next }}">
                    {% endif %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-medium small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input
                                type="text"
                                class="form-control border-start-0"
                                id="id_username"
                                name="username"
                                value="{{ username|default:'' }}"
                                placeholder="e.g. warden or STU-101"
                                required
                                autofocus
                            >
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-medium small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input
                                type="password"
                                class="form-control border-start-0"
                                id="id_password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
