{% extends 'base.html' %}

{% block title %}Remove {{ item_type }} — HostelEase{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header">
                <h1 class="h4 mb-0">Remove {{ item_type }}</h1>
            </div>
            <div class="card-body">
                <p>Are you sure you want to remove <strong>{{ object }}</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Confirm Remove</button>
                        <a href="{% url cancel_url_name %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
